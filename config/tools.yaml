################################################################################
# SHELL SETUP
################################################################################
shell:
  change_root_shell: true
  change_user_shell: true
  dotfiles:
    - src: "my_shell/bashrc"
      dest: "/home/{username}/.bashrc"
    - src: "my_shell/zshrc"
      dest: "/home/{username}/.zshrc"
    - src: "my_shell/root-zshrc"
      dest: "/root/.zshrc"

################################################################################
# GITHUB TOOLS (pre-cloned, moved to /opt/)
################################################################################
github:
  source_dir: "tools"
  dest_dir: "/opt"

################################################################################
# SYSTEM
################################################################################
system:
  update_before_install: true
  fix_broken_after_install: true
  autoremove_after_install: true

################################################################################
# GO ENVIRONMENT
# Sets persistent Go env vars via `go env -w`.
# These are saved to ~/.config/go/env and survive reboots.
#
# WHY NOT /usr/local/go as GOPATH:
#   That directory is where the Go compiler itself lives.
#   Your binaries and modules go in ~/go (or /root/go for root).
#   Mixing them causes permission errors and breaks `go install`.
################################################################################
go_env:
  env_vars:
    GOPATH: "/usr/local/go" # where `go install` puts binaries
    GOMODCACHE: "/usr/local/go/pkg/mod" # where module cache lives

################################################################################
# VIRTUALBOX
# Uses the modern gpg --dearmor method (NOT deprecated apt-key add).
# Change version to match what you want, e.g. "7.0" or "7.1"
################################################################################
virtualbox:
  version: "7.1"

################################################################################
# DOCKER
# method: "script"  → uses get.docker.com convenience script (easiest)
# method: "repo"    → adds Docker's apt repo manually (more control)
################################################################################
docker:
  method: "script" # "script" or "repo"
  add_user_to_group: true # adds your user to the docker group (no sudo needed)
  autostart: false # set true if you want docker to start at boot

################################################################################
# EXTRAS
# One-off tasks. Set install: false to skip any section.
################################################################################
extras:
  brave:
    install: true

  bangla_fonts:
    install: true

  purge_parrot_updater: true

  ollama:
    install: true
    disable_autostart: true # disable boot service; run manually with: ollama serve
    models:
      - mistral # ~4.1GB — comment out if on slow connection
      - codellama # ~3.8GB — comment out if on slow connection

  snap:
    packages:
      - name: "video-downloader"
      - name: "notion-desktop"
      - name: "google-bird"
      - name: "snap-store"

  gems:
    packages:
      - name: "wpscan"
      - name: "haiti"
