################################################################################
#  Parrot OS Setup - Master Configuration
#  Edit this file to add/remove/modify any tools before running setup.py
################################################################################

meta:
  username: "rradhasan" # Your non-root username
  shell: "/usr/bin/zsh" # Target shell
  dotfiles_dir: "my_shell" # Relative path to your dotfiles folder
  deb_dir: "deb" # Relative path to your .deb packages folder
  github_tools_dir: "tools" # Pre-cloned github tools dir (moved to /opt/)
